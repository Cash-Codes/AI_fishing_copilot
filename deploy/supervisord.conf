# supervisord.conf — Process manager for the single-container deployment.
#
# Manages three processes:
#   nginx     — public reverse proxy on port 8080
#   backend   — FastAPI/uvicorn on port 8000 (internal)
#   frontend  — Next.js standalone server on port 3000 (internal)
#
# All logs are forwarded to stdout/stderr so Cloud Run captures them.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

# ── nginx ──────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── FastAPI (uvicorn) ──────────────────────────────────────────────────────────
# --root-path /api tells FastAPI it is mounted behind the /api prefix so that
# the generated OpenAPI schema and Swagger UI use the correct paths.
[program:backend]
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --root-path /api
directory=/app/backend
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Next.js standalone server ──────────────────────────────────────────────────
[program:frontend]
command=node server.js
directory=/app/frontend
environment=PORT=3000,HOSTNAME="127.0.0.1"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

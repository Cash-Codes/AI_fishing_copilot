# nginx.conf — Reverse proxy for the single-container deployment.
#
# Layout:
#   Port 8080  — public (Cloud Run routes here)
#   Port 8000  — FastAPI / uvicorn  (internal only)
#   Port 3000  — Next.js standalone server  (internal only)
#
# Routing:
#   /api/*  →  FastAPI   (the /api prefix is stripped before forwarding)
#   /*      →  Next.js

# Run as a single worker process; container-level isolation replaces
# traditional multi-worker nginx deployments.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to stdout/stderr so Cloud Run picks them up.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;

    # ── Upstream services ───────────────────────────────────────────────────
    upstream backend {
        server 127.0.0.1:8000;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    server {
        listen 8080;
        server_name _;

        # ── FastAPI (strip /api prefix before proxying) ──────────────────
        # /api/recommend  →  http://backend/recommend
        # /api/health     →  http://backend/health
        # /api/docs       →  http://backend/docs
        location /api/ {
            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Allow reasonably slow AI responses without timing out.
            proxy_read_timeout 60s;
        }

        # ── Next.js (all other traffic) ──────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Required for Next.js hot-reload WebSocket (dev only, harmless in prod).
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
